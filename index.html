<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPC Temperature Extremes Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0f172a;
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.5px; }
        header p { margin: 6px 0 0 0; color: #94a3b8; font-size: 0.92rem; }

        .nav-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 18px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .nav-btn {
            padding: 10px 20px;
            border: none;
            background: #e2e8f0;
            color: #475569;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .nav-btn:hover:not(.active) { background: #cbd5e1; }
        .nav-btn.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
        }

        .status-msg {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .panel {
            display: none;
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .image-grid {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .image-card {
            flex: 1;
            min-width: 480px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }
        .image-card.full-width {
            width: 100%;
            margin-top: 24px;
        }
        .image-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .image-card img:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .modal-content {
            max-width: 95%;
            max-height: 90vh;
            border-radius: 4px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
        }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f5f9;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close:hover { color: #ef4444; }
        .modal-hint { color: #94a3b8; margin-top: 15px; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .image-card { min-width: 100%; }
            .panel { padding: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>WPC Superensemble vs NBM</h1>
        <p id="metaSubtitle">Loading operational forecast metadata...</p>
    </header>

    <div class="nav-container" id="tabs"></div>
    <div id="panels"></div>

    <div id="imageModal" class="modal" onclick="closeModal(event)">
        <span class="close" onclick="closeModal(event)">&times;</span>
        <img class="modal-content" id="enlargedImg" alt="Enlarged Forecast Map">
        <div class="modal-hint">Click outside image or press ESC to close</div>
    </div>

    <script>
        const now = new Date();
        const utcHour = now.getUTCHours();
        const utcMinute = now.getUTCMinutes();
        const cacheBuster = `?v=${now.getTime()}`;

        const tabsContainer = document.getElementById('tabs');
        const panelsContainer = document.getElementById('panels');
        const metaSubtitle = document.getElementById('metaSubtitle');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('enlargedImg');

        let loadedOffsets = [];

        function getFallbackEntries() {
            const isNightShift = (utcHour === 1 && utcMinute > 30) || (utcHour >= 2 && utcHour <= 12) || (utcHour === 13 && utcMinute <= 30);
            const offsets = isNightShift ? [4, 5, 6, 7, 8] : [3, 4, 5, 6, 7];
            const baseDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            if (isNightShift || utcHour <= 1) {
                baseDate.setUTCDate(baseDate.getUTCDate() - 1);
            }
            return offsets.map(offset => {
                const d = new Date(baseDate);
                d.setUTCDate(d.getUTCDate() + offset);
                const label = d.toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'
                });
                return { offset, label };
            });
        }

        function checkImage(entry) {
            return new Promise((resolve) => {
                const imgTester = new Image();
                imgTester.onload = () => resolve(entry);
                imgTester.onerror = () => resolve(null);
                imgTester.src = `output/day_${entry.offset}_percentile.png${cacheBuster}`;
            });
        }

        async function initDashboard() {
            let entries = getFallbackEntries();

            try {
                const res = await fetch(`output/manifest.json${cacheBuster}`);
                if (res.ok) {
                    const manifest = await res.json();
                    if (manifest.global_init && manifest.nbm_init) {
                        const updatedPart = manifest.run_timestamp ? ` | Generated: ${manifest.run_timestamp}` : '';
                        metaSubtitle.textContent = `Ensemble Init: ${manifest.global_init} | NBM Base: ${manifest.nbm_init}${updatedPart}`;
                    }
                    if (Array.isArray(manifest.offsets) && manifest.offsets.length > 0) {
                        entries = manifest.offsets.map(item =>
                            typeof item === 'object' && item !== null
                                ? { offset: item.offset, label: item.valid_date || `Day +${item.offset}` }
                                : { offset: item, label: `Day +${item}` }
                        );
                    }
                }
            } catch (_) {
                metaSubtitle.textContent = 'Displaying active operational window';
            }

            const results = await Promise.all(entries.map(checkImage));
            const validEntries = results.filter(item => item !== null);

            if (validEntries.length === 0) {
                panelsContainer.innerHTML = `<div class="status-msg">No operational outputs are available for this shift yet. Please check back later.</div>`;
                return;
            }

            validEntries.forEach((entry, idx) => {
                const { offset, label } = entry;
                loadedOffsets.push(offset);

                const img1Src = `output/day_${offset}_percentile.png${cacheBuster}`;
                const img2Src = `output/day_${offset}_verification.png${cacheBuster}`;
                const img3Src = `output/day_${offset}_difference.png${cacheBuster}`;

                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.id = `btn-${offset}`;
                btn.innerText = label;
                btn.onclick = () => activateTab(offset);
                tabsContainer.appendChild(btn);

                const panel = document.createElement('div');
                panel.className = 'panel';
                panel.id = `panel-${offset}`;

                const grid = document.createElement('div');
                grid.className = 'image-grid';

                const card1 = document.createElement('div');
                card1.className = 'image-card';
                card1.innerHTML = `<img src="${img1Src}" alt="Percentile Map - ${label}" onclick="openModal(this.src)">`;

                const card2 = document.createElement('div');
                card2.className = 'image-card';
                card2.innerHTML = `<img src="${img2Src}" alt="Verification Map - ${label}" onclick="openModal(this.src)">`;

                const card3 = document.createElement('div');
                card3.className = 'image-card full-width';
                card3.innerHTML = `<img src="${img3Src}" alt="Difference Map - ${label}" onclick="openModal(this.src)">`;

                grid.appendChild(card1);
                grid.appendChild(card2);
                panel.appendChild(grid);
                panel.appendChild(card3);
                panelsContainer.appendChild(panel);

                if (idx === 0) {
                    activateTab(offset);
                }
            });
        }

        function activateTab(targetOffset) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`panel-${targetOffset}`).classList.add('active');
            document.getElementById(`btn-${targetOffset}`).classList.add('active');
        }

        function openModal(src) {
            modal.style.display = 'flex';
            modalImg.src = src;
        }

        function closeModal(event) {
            if (event && event.target && event.target.id === 'enlargedImg') return;
            modal.style.display = 'none';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                modal.style.display = 'none';
                return;
            }
            if (modal.style.display === 'flex' || loadedOffsets.length === 0) return;

            const activeBtn = document.querySelector('.nav-btn.active');
            if (!activeBtn) return;

            const currentOffset = parseInt(activeBtn.id.replace('btn-', ''), 10);
            const currentIndex = loadedOffsets.indexOf(currentOffset);
            if (currentIndex === -1) return;

            if (event.key === 'ArrowRight') {
                activateTab(loadedOffsets[(currentIndex + 1) % loadedOffsets.length]);
            } else if (event.key === 'ArrowLeft') {
                activateTab(loadedOffsets[(currentIndex - 1 + loadedOffsets.length) % loadedOffsets.length]);
            }
        });

        initDashboard();
    </script>
</body>
</html>
