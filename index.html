<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPC Temperature Extremes Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0f172a;
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.5px; }
        header p { margin: 6px 0 0 0; color: #94a3b8; font-size: 0.92rem; }

        /* Controls Bar: Metric Toggle + Valid Date Tabs */
        .controls-bar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .metric-toggle {
            display: inline-flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 8px;
            gap: 4px;
        }
        .metric-btn {
            padding: 8px 22px;
            border: none;
            background: transparent;
            color: #475569;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .metric-btn.active[data-metric="max"] {
            background: #dc2626;
            color: white;
            box-shadow: 0 2px 4px rgba(220, 38, 38, 0.3);
        }
        .metric-btn.active[data-metric="min"] {
            background: #0284c7;
            color: white;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-btn {
            padding: 9px 18px;
            border: none;
            background: #e2e8f0;
            color: #475569;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .nav-btn:hover:not(.active) { background: #cbd5e1; }
        .nav-btn.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
        }

        .status-msg {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .panel {
            padding: 28px;
            max-width: 1600px;
            margin: 0 auto;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .image-grid {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .image-card {
            flex: 1;
            min-width: 480px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }
        .image-card.full-width {
            width: 100%;
            margin-top: 24px;
        }
        .image-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .image-card img:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .modal-content {
            max-width: 95%;
            max-height: 90vh;
            border-radius: 4px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
        }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f5f9;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close:hover { color: #ef4444; }
        .modal-hint { color: #94a3b8; margin-top: 15px; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .image-card { min-width: 100%; }
            .panel { padding: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>WPC Superensemble vs NBM</h1>
        <p id="metaSubtitle">Loading operational forecast metadata...</p>
    </header>

    <div class="controls-bar">
        <div class="metric-toggle">
            <button class="metric-btn active" data-metric="max" onclick="switchMetric('max')">MaxT (12z–06z)</button>
            <button class="metric-btn" data-metric="min" onclick="switchMetric('min')">MinT (00z–18z)</button>
        </div>
        <div class="nav-container" id="tabs"></div>
    </div>

    <div id="panels"></div>

    <div id="imageModal" class="modal" onclick="closeModal(event)">
        <span class="close" onclick="closeModal(event)">&times;</span>
        <img class="modal-content" id="enlargedImg" alt="Enlarged Forecast Map">
        <div class="modal-hint">Click outside image or press ESC to close</div>
    </div>

    <script>
        const now = new Date();
        const utcHour = now.getUTCHours();
        const utcMinute = now.getUTCMinutes();
        const cacheBuster = `?v=${now.getTime()}`;

        const tabsContainer = document.getElementById('tabs');
        const panelsContainer = document.getElementById('panels');
        const metaSubtitle = document.getElementById('metaSubtitle');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('enlargedImg');

        let validEntriesByMetric = { max: [], min: [] };
        let activeMetric = 'max';
        let activeOffset = null;

        function getFallbackEntries() {
            const isNightShift = (utcHour === 1 && utcMinute > 30) || (utcHour >= 2 && utcHour <= 12) || (utcHour === 13 && utcMinute <= 30);
            const offsets = isNightShift ? [4, 5, 6, 7, 8] : [3, 4, 5, 6, 7];
            const baseDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            if (isNightShift || utcHour <= 1) {
                baseDate.setUTCDate(baseDate.getUTCDate() - 1);
            }
            return offsets.map(offset => {
                const d = new Date(baseDate);
                d.setUTCDate(d.getUTCDate() + offset);
                const label = d.toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'
                });
                return { offset, label };
            });
        }

        function normalizeEntries(rawList) {
            return rawList.map(item =>
                typeof item === 'object' && item !== null
                    ? { offset: item.offset, label: item.valid_date || `Day +${item.offset}` }
                    : { offset: item, label: `Day +${item}` }
            );
        }

        function checkImage(entry, metric) {
            const prefix = metric === 'min' ? 'min_' : '';
            return new Promise((resolve) => {
                const imgTester = new Image();
                imgTester.onload = () => resolve(entry);
                imgTester.onerror = () => resolve(null);
                imgTester.src = `output/day_${entry.offset}_${prefix}percentile.png${cacheBuster}`;
            });
        }

        async function initDashboard() {
            const fallback = getFallbackEntries();
            let rawMax = fallback;
            let rawMin = fallback;

            try {
                const res = await fetch(`output/manifest.json${cacheBuster}`);
                if (res.ok) {
                    const manifest = await res.json();
                    if (manifest.global_init && manifest.nbm_init) {
                        const updatedPart = manifest.run_timestamp ? ` | Generated: ${manifest.run_timestamp}` : '';
                        metaSubtitle.textContent = `Ensemble Init: ${manifest.global_init} | NBM Base: ${manifest.nbm_init}${updatedPart}`;
                    }
                    if (Array.isArray(manifest.offsets) && manifest.offsets.length > 0) {
                        rawMax = normalizeEntries(manifest.offsets);
                    }
                    if (Array.isArray(manifest.min_offsets) && manifest.min_offsets.length > 0) {
                        rawMin = normalizeEntries(manifest.min_offsets);
                    } else {
                        rawMin = rawMax;
                    }
                }
            } catch (_) {
                metaSubtitle.textContent = 'Displaying active operational window';
            }

            const [maxChecks, minChecks] = await Promise.all([
                Promise.all(rawMax.map(e => checkImage(e, 'max'))),
                Promise.all(rawMin.map(e => checkImage(e, 'min')))
            ]);

            validEntriesByMetric.max = maxChecks.filter(Boolean);
            validEntriesByMetric.min = minChecks.filter(Boolean);

            renderView();
        }

        function switchMetric(metric) {
            if (activeMetric === metric) return;
            activeMetric = metric;
            document.querySelectorAll('.metric-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.metric === metric);
            });
            renderView();
        }

        function renderView() {
            const entries = validEntriesByMetric[activeMetric];
            tabsContainer.innerHTML = '';

            if (entries.length === 0) {
                const label = activeMetric === 'max' ? 'MaxT' : 'MinT';
                panelsContainer.innerHTML = `<div class="status-msg">No operational ${label} outputs are available for this shift yet. Please check back later.</div>`;
                return;
            }

            if (!entries.some(e => e.offset === activeOffset)) {
                activeOffset = entries[0].offset;
            }

            entries.forEach(entry => {
                const btn = document.createElement('button');
                btn.className = `nav-btn${entry.offset === activeOffset ? ' active' : ''}`;
                btn.innerText = entry.label;
                btn.onclick = () => {
                    activeOffset = entry.offset;
                    renderView();
                };
                tabsContainer.appendChild(btn);
            });

            const current = entries.find(e => e.offset === activeOffset) || entries[0];
            const prefix = activeMetric === 'min' ? 'min_' : '';
            const img1Src = `output/day_${current.offset}_${prefix}percentile.png${cacheBuster}`;
            const img2Src = `output/day_${current.offset}_${prefix}verification.png${cacheBuster}`;
            const img3Src = `output/day_${current.offset}_${prefix}difference.png${cacheBuster}`;

            panelsContainer.innerHTML = `
                <div class="panel">
                    <div class="image-grid">
                        <div class="image-card">
                            <img src="${img1Src}" alt="Percentile Map - ${current.label}" onclick="openModal(this.src)">
                        </div>
                        <div class="image-card">
                            <img src="${img2Src}" alt="Verification Map - ${current.label}" onclick="openModal(this.src)">
                        </div>
                    </div>
                    <div class="image-card full-width">
                        <img src="${img3Src}" alt="Difference Map - ${current.label}" onclick="openModal(this.src)">
                    </div>
                </div>
            `;
        }

        function openModal(src) {
            modal.style.display = 'flex';
            modalImg.src = src;
        }

        function closeModal(event) {
            if (event && event.target && event.target.id === 'enlargedImg') return;
            modal.style.display = 'none';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                modal.style.display = 'none';
                return;
            }
            if (modal.style.display === 'flex') return;

            const entries = validEntriesByMetric[activeMetric];
            if (entries.length === 0) return;

            const currentIndex = entries.findIndex(e => e.offset === activeOffset);
            if (currentIndex === -1) return;

            if (event.key === 'ArrowRight') {
                activeOffset = entries[(currentIndex + 1) % entries.length].offset;
                renderView();
            } else if (event.key === 'ArrowLeft') {
                activeOffset = entries[(currentIndex - 1 + entries.length) % entries.length].offset;
                renderView();
            } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                switchMetric(activeMetric === 'max' ? 'min' : 'max');
            }
        });

        initDashboard();
    </script>
</body>
</html>
